[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"
edge_functions = "netlify/edge-functions"

[dev]
command = "npm run dev"
port = 3000

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/irs/*"
[headers.values]
"Access-Control-Allow-Origin" = "*"
"Cache-Control" = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"
[headers.values]
"Cache-Control" = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.css"
[headers.values]
"Cache-Control" = "public, max-age=31536000, immutable"

[[headers]]
for = "/logo*"
[headers.values]
"Cache-Control" = "public, max-age=31536000, immutable"
